name: vendo-prod

# Production stack served via Cloudflare Tunnel — no host ports exposed.
# Bring up: docker compose -f docker-compose.prod.yml --env-file .env.prod up -d
# Bring down: docker compose -f docker-compose.prod.yml down
#
# Required files (created by setup):
#   .env.prod                 — secrets, see .env.prod.example
#   medplum.config.prod.json  — generated by scripts/gen-prod-config.sh

services:
  postgres:
    image: postgres:16.4-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: medplum
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      POSTGRES_DB: medplum
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U medplum"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10

  # Real Medplum API server. Renamed from `medplum-server` so the public
  # name `medplum-server` can be reused by the nginx edge below — that way
  # the existing Cloudflare Tunnel public-hostname target
  # (http://medplum-server:8103) keeps working without any CF dashboard
  # edits when we slot the redirect/proxy layer in front.
  medplum-backend:
    image: medplum/medplum-server:5.1.9
    restart: unless-stopped
    depends_on:
      postgres: { condition: service_healthy }
      redis:    { condition: service_healthy }
    command: ["file:/etc/medplum.config.json"]
    volumes:
      - ./medplum.config.prod.json:/etc/medplum.config.json:ro
      - medplum-binary:/app/binary
    healthcheck:
      test:
        - "CMD"
        - "node"
        - "-e"
        - "fetch('http://localhost:8103/healthcheck').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"
      interval: 15s
      timeout: 5s
      retries: 30
      start_period: 30s

  # Medplum admin/console UI (separate from the API). The clinic ops team
  # uses this for low-level project/AccessPolicy/User management — things
  # the doctor-facing portal deliberately doesn't expose. Reached via the
  # nginx edge below; not exposed directly.
  medplum-app:
    image: medplum/medplum-app:5.1.9
    restart: unless-stopped
    depends_on:
      medplum-backend: { condition: service_healthy }
    environment:
      MEDPLUM_BASE_URL: ${MEDPLUM_BASE_URL:?MEDPLUM_BASE_URL must be set}/

  # Edge proxy that owns the medplum.example.com hostname. See
  # medplum-edge.nginx.conf for routing rules. API paths → medplum-backend;
  # everything else → medplum-app (admin console). Listens on 8103 to
  # match the existing Cloudflare Tunnel target.
  medplum-server:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      medplum-backend: { condition: service_healthy }
      medplum-app:     { condition: service_started }
    volumes:
      - ./medplum-edge.nginx.conf:/etc/nginx/conf.d/default.conf:ro
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8103/edgehealth"]
      interval: 15s
      timeout: 3s
      retries: 10
      start_period: 5s

  portal:
    build:
      context: ../..
      dockerfile: apps/portal/Dockerfile
    restart: unless-stopped
    depends_on:
      medplum-server: { condition: service_healthy }
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_MEDPLUM_BASE_URL: ${MEDPLUM_BASE_URL:?MEDPLUM_BASE_URL must be set}/
      NEXT_PUBLIC_APP_BASE_URL: ${APP_BASE_URL:?APP_BASE_URL must be set}
      SESSION_SECRET: ${SESSION_SECRET:?SESSION_SECRET must be set (≥32 chars)}
      PORT: "3000"
      HOSTNAME: "0.0.0.0"
      # Phase 1.9 — SMTP. Empty SMTP_HOST falls back to the stub transport
      # (rendered emails go to logs only). Set host+credentials in .env.prod
      # to switch on real delivery without rebuilding the image.
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM_ADDRESS: ${SMTP_FROM_ADDRESS:-no-reply@example.com}
      SMTP_FROM_NAME: ${SMTP_FROM_NAME:-Vendo Demo Clinic}
      # Health endpoint detail-view auth (empty = open).
      HEALTH_TOKEN: ${HEALTH_TOKEN:-}
      # Admin service-account used by privileged server actions (invite /
      # update / reset password / (de)activate referrer). Empty values
      # leave the UI usable for read-only flows; admin actions will fail
      # with a friendly "admin service-account is not configured" error.
      MEDPLUM_ADMIN_EMAIL: ${MEDPLUM_ADMIN_EMAIL:-}
      MEDPLUM_ADMIN_PASSWORD: ${MEDPLUM_ADMIN_PASSWORD:-}
      # Prelaunch QA — when set, every outbound email is redirected to
      # this inbox with the original recipient encoded in the subject
      # line. Unset for real go-live.
      EMAIL_OVERRIDE_TO: ${EMAIL_OVERRIDE_TO:-}
      SMTP_SECURE: ${SMTP_SECURE:-}
    healthcheck:
      test:
        - "CMD"
        - "node"
        - "-e"
        - "fetch('http://localhost:3000/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 30s

  # Two separate Cloudflare tunnels — one per public hostname so each can be
  # rotated/revoked independently. Bring up with:
  #   docker compose -f docker-compose.prod.yml --profile tunnel up -d
  cloudflared-portal:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    profiles: ["tunnel"]
    command: tunnel --no-autoupdate run --token ${CF_TUNNEL_TOKEN_PORTAL:-}
    depends_on:
      - portal

  cloudflared-medplum:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    profiles: ["tunnel"]
    command: tunnel --no-autoupdate run --token ${CF_TUNNEL_TOKEN_MEDPLUM:-}
    depends_on:
      - medplum-server

  # Phase 3.5 — nightly Postgres backup. Runs the pg_dump|openssl pipeline
  # at 03:15 UTC (≈ 11:15 PM ET, after clinic hours) using a cron loop in a
  # postgres-client image. Backups land in the host-mounted ./backups
  # directory; encryption is handled inside the script via BACKUP_PASSPHRASE.
  # Off-host replication (rsync to remote / S3) is deliberately separate so
  # this container has no outbound creds — see DEPLOY.md for the next layer.
  postgres-backup:
    image: postgres:16.4-alpine
    restart: unless-stopped
    depends_on:
      postgres: { condition: service_healthy }
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_USER: medplum
      POSTGRES_DB: medplum
      PGPASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      BACKUP_PASSPHRASE: ${BACKUP_PASSPHRASE:?BACKUP_PASSPHRASE must be set (≥32 chars)}
      RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-14}
      BACKUP_CRON: ${BACKUP_CRON:-15 3 * * *}
    volumes:
      - ./scripts/backup-postgres.sh:/usr/local/bin/backup-postgres.sh:ro
      - ./backups:/backups
    # Install openssl, register the cron line, and tail crond so the
    # container's main process is the scheduler itself. crond -f keeps
    # PID 1 alive and forwards signals (Docker stop works cleanly).
    entrypoint:
      - /bin/sh
      - -c
      - |
        apk add --no-cache openssl >/dev/null
        mkdir -p /etc/crontabs
        printf '%s /usr/local/bin/backup-postgres.sh >> /var/log/backup.log 2>&1\n' "$$BACKUP_CRON" > /etc/crontabs/root
        # Run an initial backup immediately so the first cron tick isn't 24h away.
        /usr/local/bin/backup-postgres.sh >> /var/log/backup.log 2>&1 || true
        touch /var/log/backup.log
        crond -f -l 8 &
        tail -f /var/log/backup.log

volumes:
  pg-data:
  redis-data:
  medplum-binary:
