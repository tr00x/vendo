# Edge proxy for the Medplum API hostname (medplum.example.com).
# Sits between Cloudflared and two backends:
#   1. medplum-backend:8103 — REST API (/auth, /fhir, /admin, /oauth2,
#      /storage, /healthcheck, /metrics, /.well-known)
#   2. medplum-app:80       — admin console UI (everything else, including
#      /, /signin, /Patient, /Practitioner, etc.)
# Listening on 8103 so the existing CF Tunnel public-hostname target
# (http://medplum-server:8103) keeps working without dashboard edits.

upstream medplum_backend {
  server medplum-backend:8103;
  keepalive 32;
}

upstream medplum_app {
  server medplum-app:3000;
  keepalive 32;
}

server {
  listen 8103;
  server_name _;

  # Body size for FHIR Bundles + Binary uploads.
  client_max_body_size 100m;

  # Real API surface — passthrough to the Medplum API server.
  location ~ ^/(healthcheck|metrics|fhir|auth|admin|oauth2|storage|\.well-known) {
    proxy_pass http://medplum_backend;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
  }

  # Edge healthcheck for the nginx layer itself.
  location = /edgehealth {
    access_log off;
    return 200 "ok\n";
    add_header Content-Type text/plain;
  }

  # Everything else (/, /signin, all admin-app SPA routes + static
  # assets) → Medplum admin console. The SPA does its own client-side
  # routing once the index.html is served.
  location / {
    proxy_pass http://medplum_app;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
  }
}
